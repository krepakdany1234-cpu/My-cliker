<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мифриловый Кликер</title>
    
    <script async src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; box-sizing: border-box; outline: none; }
        
        body { 
            margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; 
            font-family: 'Georgia', serif; overflow: hidden; padding: 20px 0;
            background-image: url('IMG_20260311_002626.png');
            background-size: cover; background-position: center; background-color: #1a2f24;
            transition: background-image 0.5s ease-in-out;
        }

        /* Адаптивные частицы (листья, камни, пыль) */
        .particle {
            position: absolute; top: -10%; 
            pointer-events: none; z-index: 1; 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); 
            animation: fall linear forwards;
        }
        @keyframes fall {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.85; }
            80% { opacity: 0.85; }
            100% { transform: translate(var(--end-x), 110vh) rotate(var(--rotation)); opacity: 0; }
        }

        .guild-board { background-image: url('1000019094-removebg-preview.png'); background-size: 100% 100%; background-position: center; background-repeat: no-repeat; width: 380px; padding: 80px 40px 70px 40px; filter: drop-shadow(0 12px 12px rgba(0,0,0,0.8)); position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; margin-top: 10px; }
        .level-container { color: #ffd700; font-size: 1.4rem; font-weight: bold; text-shadow: 1px 1px 2px #000; margin-bottom: 3px; z-index: 2; transition: transform 0.2s; }
        .score-container { color: #1a0b02; font-size: 3.2rem; font-weight: bold; text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.25), -1px -1px 2px rgba(0, 0, 0, 0.9); margin-bottom: 8px; z-index: 2; }
        
        .energy-wrapper { width: 70%; background-color: rgba(10, 5, 0, 0.5); border: 1px solid rgba(0,0,0,0.8); border-radius: 8px; height: 12px; overflow: hidden; box-shadow: inset 0 3px 5px rgba(0,0,0,0.9); z-index: 2; }
        .energy-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #2e7d32, #50b487, #81c784); transition: width 0.3s ease-out; }
        .energy-text { color: #ffeba1; font-size: 0.85rem; margin-top: 4px; margin-bottom: 8px; font-weight: bold; white-space: nowrap; text-shadow: 1px 1px 3px #000; z-index: 2; }
        
        .xp-wrapper { width: 70%; background-color: rgba(10, 5, 0, 0.5); border: 1px solid rgba(0,0,0,0.8); border-radius: 8px; height: 12px; overflow: hidden; box-shadow: inset 0 3px 5px rgba(0,0,0,0.9); z-index: 2; }
        .xp-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #1976d2, #42a5f5, #90caf9); transition: width 0.2s ease-out; }
        .xp-text { color: #90caf9; font-size: 0.85rem; margin-top: 4px; font-weight: bold; white-space: nowrap; text-shadow: 1px 1px 3px #000; z-index: 2; }
        
        .ore-wrapper { flex-grow: 1; display: flex; justify-content: center; align-items: center; -webkit-tap-highlight-color: transparent; z-index: 10; margin: 15px 0; cursor: pointer; width: 100%; max-width: 340px; }
        
        .crystal-img { width: 260px; height: auto; filter: drop-shadow(0 20px 15px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 25px rgba(100, 255, 150, 0.3)); transition: transform 0.08s ease; pointer-events: none; -webkit-touch-callout: none; }
        .ore-wrapper:active .crystal-img { transform: scale(0.93) translateY(3px); }
        
        .shop-container { display: flex; gap: 10px; width: 90%; max-width: 380px; justify-content: center; z-index: 20; margin-bottom: 10px; }
        .shop-btn { flex: 1; background: linear-gradient(180deg, #8d6e63, #4e342e); border: 2px solid #3e2723; border-radius: 10px; color: #fff; padding: 10px 5px; text-align: center; font-family: 'Georgia', serif; font-size: 0.85rem; font-weight: bold; text-shadow: 1px 1px 2px #000; box-shadow: 0 4px 6px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.2); cursor: pointer; transition: transform 0.1s; }
        .shop-btn:active { transform: scale(0.95); box-shadow: 0 2px 3px rgba(0,0,0,0.6); }
        .shop-btn span { display: block; color: #ffd700; font-size: 0.75rem; margin-top: 2px; }

        .floating-text { position: absolute; color: #a5d6a7; font-size: 1.8rem; font-weight: bold; pointer-events: none; animation: floatUp 1s ease-out forwards; text-shadow: 0 0 10px #50b487, 1px 1px 2px #000; z-index: 15; white-space: nowrap; }
        .floating-text.crit { color: #ff5252; font-size: 2.2rem; text-shadow: 2px 2px 0px #000, -1px -1px 0px #000; animation: floatUpCrit 1.2s ease-out forwards; }
        
        .pickaxe-effect { position: absolute; width: 90px; height: auto; pointer-events: none; z-index: 50; transform-origin: bottom right; animation: mineStrike 0.25s ease-in-out forwards; filter: drop-shadow(3px 5px 5px rgba(0,0,0,0.7)); }
        @keyframes mineStrike { 0% { transform: rotate(-30deg) scale(1.1); opacity: 0; } 30% { transform: rotate(-60deg) scale(1.3); opacity: 1; } 100% { transform: rotate(25deg) scale(0.9); opacity: 0; } }
        
        .spark { position: absolute; width: 10px; height: 10px; background: radial-gradient(circle, #ffffff 10%, #ffd700 40%, transparent 80%); border-radius: 50%; pointer-events: none; z-index: 45; animation: sparkFly 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes sparkFly { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; } }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <div class="guild-board">
        <div class="level-container" id="level-container">Уровень <span id="level-text">1</span></div>
        <div class="score-container" id="score">0</div>
        
        <div class="energy-wrapper"><div class="energy-bar" id="energy-bar"></div></div>
        <div class="energy-text" id="energy-text">Загрузка модулей v4.3...</div>

        <div class="xp-wrapper"><div class="xp-bar" id="xp-bar"></div></div>
        <div class="xp-text" id="xp-text">Опыт: 0 / 150</div>
    </div>

    <div class="ore-wrapper" id="ore-click-zone">
        <img src="1000019091-removebg-preview.png" alt="Кристалл" class="crystal-img" id="ore-img" draggable="false">
    </div>

    <div class="shop-container">
        <button class="shop-btn" id="upgrade-click-btn">Качать Кирку<span id="click-cost">Цена: 15</span></button>
        <button class="shop-btn" id="upgrade-energy-btn">Качать Энергию<span id="energy-cost">Цена: 25</span></button>
    </div>

    <script>
        // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И НАСТРОЙКИ (Верхний безопасный уровень)
        var tg = null;
        var storageAvailable = false;
        var score = 0, level = 1, xp = 0, lastTickTime = Date.now();
        var clickUpgradeLvl = 0, energyUpgradeLvl = 0, energy = 500;
        var textEl = null;

        // Глобальный перехватчик критических ошибок
        window.onerror = function(msg, url, lineNo) {
            var el = document.getElementById('energy-text');
            if(el) { el.innerText = "ОШИБКА БРАУЗЕРА: " + msg; el.style.color = "#ff5252"; }
            return false;
        };

        // ФУНКЦИИ РАСЧЕТОВ И ЛОГИКИ
        function getNum(key, fallback) {
            if (!storageAvailable) return fallback;
            var v = localStorage.getItem(key);
            if (v === null || v === undefined || v === 'NaN') return fallback;
            var n = parseInt(v);
            return isNaN(n) ? fallback : n;
        }

        function getClickPower() { return 1 + (level - 1) + clickUpgradeLvl; }
        function getMaxEnergy() { return 500 + (level - 1) * 10 + (energyUpgradeLvl * 50); }
        function getRegenInterval() { return Math.max(60000, 300000 - (level - 1) * 200 - (energyUpgradeLvl * 5000)); }
        function getXpNeeded() { return Math.floor(150 * Math.pow(1.4, level - 1)); }
        function getClickCost() { return Math.floor(15 * Math.pow(1.5, clickUpgradeLvl)); }
        function getEnergyCost() { return Math.floor(25 * Math.pow(1.6, energyUpgradeLvl)); }

        // Генератор адаптивных эффектов окружения
        function createParticle() {
            var particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + 'vw';
            var scale = 0.5 + Math.random() * 0.5;

            if (level < 15) {
                // До 15 уровня: Листья
                particle.style.background = Math.random() < 0.6 ? 'linear-gradient(135deg, #f8bbd0, #e91e63)' : 'linear-gradient(135deg, #4caf50, #1b5e20)';
                particle.style.borderRadius = '0 50% 0 50%';
                particle.style.width = (15 * scale) + 'px'; 
                particle.style.height = (15 * scale) + 'px';
            } else {
                // После 15 уровня: Осыпание шахты
                if (Math.random() < 0.4) {
                    // Каменная крошка
                    particle.style.background = 'linear-gradient(135deg, #757575, #424242)';
                    particle.style.borderRadius = '30% 60% 40% 70%';
                    particle.style.width = (8 * scale) + 'px'; 
                    particle.style.height = (6 * scale) + 'px';
                } else {
                    // Шахтная пыль (Золотая или Фиолетовая на 30+)
                    var dustColor = level >= 30 ? '#b388ff' : '#ffd700'; 
                    particle.style.background = dustColor;
                    particle.style.borderRadius = '50%';
                    particle.style.width = (3 * scale) + 'px'; 
                    particle.style.height = (3 * scale) + 'px';
                    particle.style.boxShadow = '0 0 6px ' + dustColor;
                }
            }

            particle.style.setProperty('--end-x', ((Math.random() - 0.5) * 150) + 'px');
            particle.style.setProperty('--rotation', ((Math.random() > 0.5 ? 1 : -1) * 360) + 'deg');
            var dur = level < 15 ? (6 + Math.random() * 5) : (2.5 + Math.random() * 2.5); 
            particle.style.animationDuration = dur + 's';
            
            document.body.appendChild(particle);
            setTimeout(function() { particle.remove(); }, dur * 1000);
        }

        function updateVisuals() {
            var oreImg = document.getElementById('ore-img');
            if (!oreImg) return;
            if (level >= 30) {
                oreImg.src = '1000020138.png'; 
                document.body.style.backgroundImage = "url('1000020141.png')"; 
            } else if (level >= 15) {
                oreImg.src = 'Ruda15lvl.png'; 
                document.body.style.backgroundImage = "url('Fon15lvl.png')";
            } else {
                oreImg.src = '1000019091-removebg-preview.png'; 
                document.body.style.backgroundImage = "url('IMG_20260311_002626.png')";
            }
        }

        function saveAll() {
            if (!storageAvailable) return;
            try {
                localStorage.setItem('mithrilScore', score);
                localStorage.setItem('mithrilLevel', level);
                localStorage.setItem('mithrilXP', xp);
                localStorage.setItem('mithrilEnergy', energy);
                localStorage.setItem('lastTickTime', lastTickTime);
                localStorage.setItem('clickUpgradeLvl', clickUpgradeLvl);
                localStorage.setItem('energyUpgradeLvl', energyUpgradeLvl);
            } catch(e) {}
        }

        function updateUI() {
            if (!textEl) return;
            document.getElementById('score').innerText = score;
            document.getElementById('level-text').innerText = level;
            
            var mx = getMaxEnergy();
            document.getElementById('energy-bar').style.width = Math.min(100, (energy / mx) * 100) + '%';
            textEl.style.color = "#ffeba1";

            if (energy >= mx) {
                textEl.innerText = energy + " / " + mx + " ⚡ (Макс)";
            } else {
                var timeLeft = Math.max(0, getRegenInterval() - (Date.now() - lastTickTime));
                var m = Math.floor(timeLeft / 60000); 
                var s = Math.floor((timeLeft % 60000) / 1000);
                textEl.innerText = energy + " / " + mx + " ⚡ (+" + 100 + " через " + m + ":" + (s < 10 ? '0' : '') + s + ")";
            }

            var xpn = getXpNeeded();
            document.getElementById('xp-bar').style.width = Math.min(100, (xp / xpn) * 100) + '%';
            document.getElementById('xp-text').innerText = "Опыт: " + Math.floor(xp) + " / " + xpn;
            document.getElementById('click-cost').innerText = "Цена: " + getClickCost();
            document.getElementById('energy-cost').innerText = "Цена: " + getEnergyCost();
        }

        // ЗАПУСК ИГРЫ ПОСЛЕ ЗАГРУЗКИ СТРАНИЦЫ
        try {
            textEl = document.getElementById('energy-text');

            // Безопасное подключение Telegram WebApp
            try { if (window.Telegram && window.Telegram.WebApp) { tg = window.Telegram.WebApp; tg.expand(); } } catch(e) {}

            // Безопасная проверка локального хранилища
            try {
                localStorage.setItem('test', '1');
                localStorage.removeItem('test');
                storageAvailable = true;
            } catch(e) { storageAvailable = false; }

            // Извлечение сохраненных значений
            score = getNum('mithrilScore', 0);
            level = getNum('mithrilLevel', 1);
            xp = getNum('mithrilXP', 0);
            lastTickTime = getNum('lastTickTime', Date.now());
            clickUpgradeLvl = getNum('clickUpgradeLvl', 0);
            energyUpgradeLvl = getNum('energyUpgradeLvl', 0);

            energy = getNum('mithrilEnergy', getMaxEnergy());
            if (energy > getMaxEnergy() || energy < 0) energy = getMaxEnergy();

            // Первый запуск интерфейса
            updateVisuals();
            updateUI();
            setInterval(createParticle, 500);

            // Обработчики магазина кликов
            document.getElementById('upgrade-click-btn').addEventListener('click', function() {
                var cost = getClickCost();
                if (score >= cost) {
                    score -= cost; clickUpgradeLvl++;
                    saveAll(); updateUI();
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }
            });

            // Обработчики магазина энергии
            document.getElementById('upgrade-energy-btn').addEventListener('click', function() {
                var cost = getEnergyCost();
                if (score >= cost) {
                    score -= cost; energyUpgradeLvl++;
                    var mx = getMaxEnergy(); if(energy > mx) energy = mx;
                    saveAll(); updateUI();
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }
            });

            // Зона клика по руде
            document.getElementById('ore-click-zone').addEventListener('pointerdown', function(e) {
                e.preventDefault(); 
                if (energy >= 1) {
                    var mx = getMaxEnergy();
                    if (energy === mx) lastTickTime = Date.now();
                    energy--;

                    var isCrit = Math.random() < 0.02;
                    var dmg = getClickPower(); if (isCrit) dmg *= 5;

                    score += dmg; xp += dmg;
                    var xpn = getXpNeeded();
                    while (xp >= xpn) {
                        xp -= xpn; level++; xpn = getXpNeeded();
                        updateVisuals();
                        var container = document.getElementById('level-container');
                        if (container) {
                            container.style.transform = "scale(1.2)";
                            setTimeout(function() { container.style.transform = "scale(1)"; }, 200);
                        }
                    }

                    saveAll(); updateUI();
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(isCrit ? 'heavy' : 'light');

                    var plus = document.createElement('div');
                    plus.className = 'floating-text' + (isCrit ? ' crit' : '');
                    plus.innerText = "+" + dmg;
                    plus.style.left = (e.clientX - 15) + 'px'; plus.style.top = (e.clientY - 35) + 'px';
                    document.body.appendChild(plus);
                    setTimeout(function() { plus.remove(); }, 1100);

                    var pick = document.createElement('img');
                    pick.src = '1000019118-removebg-preview.png';
                    pick.className = 'pickaxe-effect';
                    pick.style.left = (e.clientX - 50) + 'px'; pick.style.top = (e.clientY - 60) + 'px';
                    document.body.appendChild(pick);
                    setTimeout(function() { pick.remove(); }, 250);

                    for (var i = 0; i < (isCrit ? 5 : 3); i++) {
                        var spark = document.createElement('div');
                        spark.className = 'spark';
                        if (isCrit) spark.style.background = 'radial-gradient(circle, #fff, #ff5252, transparent)';
                        spark.style.left = e.clientX + 'px'; spark.style.top = e.clientY + 'px';
                        spark.style.setProperty('--tx', ((Math.random() - 0.5) * 140) + 'px');
                        spark.style.setProperty('--ty', ((Math.random() - 0.5) * 140} + 'px');
                        document.body.appendChild(spark);
                        setTimeout(function() { spark.remove(); }, 500);
                    }
                } else {
                    if (textEl) {
                        textEl.style.color = '#ff5252';
                        setTimeout(function() { textEl.style.color = '#ffeba1'; }, 300);
                    }
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }
            });

            // Таймер регенерации энергии
            setInterval(function() {
                var mx = getMaxEnergy();
                if (energy < mx) {
                    var passed = Date.now() - lastTickTime;
                    var interval = getRegenInterval();
                    if (passed >= interval) {
                        var ticks = Math.floor(passed / interval);
                        energy = Math.min(mx, energy + (ticks * 100));
                        lastTickTime += ticks * interval;
                        saveAll();
                    }
                } else { lastTickTime = Date.now(); }
                updateUI();
            }, 1000);

        } catch(err) {
            var el = document.getElementById('energy-text');
            if(el) { el.innerText = "КРИТ СБОЙ: " + err.message; el.style.color = "red"; }
        }
    </script>
</body>
</html>
